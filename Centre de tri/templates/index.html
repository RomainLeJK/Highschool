<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centre de Tri - Formulaire</title>
    <link rel="stylesheet" href="../static/style_index.css">
    <script src="../static/script.js"></script>
</head>
<body>
    <div class="contenant_general">
        <div class="titre_fond"><h1>Centre de tri</h1></div>
        <form action="http://localhost:5000/tri" method="post">
            <label id="label_tableau">Tableau à trier :</label>
            <br><input type="text" name="valeur_tableau" id="tableau" placeholder="Ex : [1,2,3,4]"/>
            <div id="tri_container">
                <label class="tri_nom">Tri par Insertion </label> : <input type="radio" name="choix_tri" value="tri_par_insertion" checked/>
                <label class="tri_nom">Tri par Sélection </label> : <input type="radio" name="choix_tri" value="tri_par_selection"/>
            </div>
            <input type="submit" value="Envoyer" id="bouton_envoyer"/>
        </form>
    </div> 
</body>
</html>
